name: NEUGI Swarm V2 CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_ROOT_USER_ACTION: ignore

jobs:
  docs-claims:
    name: Docs Claims Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps for claim validation
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Regenerate provider matrix
        run: python scripts/generate_provider_matrix.py
      - name: Ensure provider matrix is committed
        run: git diff --exit-code -- neugi_swarm_v2/docs/PROVIDER_MATRIX.md
      - name: Validate docs claims (advisory for PR)
        if: github.event_name == 'pull_request'
        run: python scripts/validate_doc_claims.py --mode advisory
      - name: Validate docs claims (strict on push)
        if: github.event_name != 'pull_request'
        run: python scripts/validate_doc_claims.py --mode strict

  dashboard-contract:
    name: Dashboard Contract Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: './neugi_swarm_v2/pyproject.toml'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate frontend-backend API contract
        run: pytest tests/test_dashboard_api_contract.py -q -p no:anchorpy

      - name: Validate dashboard schema/auth contracts
        run: pytest tests/test_dashboard_setup_api.py tests/test_dashboard_auth_mode.py tests/test_dashboard_response_schema_snapshot.py -q -p no:anchorpy

  dashboard-e2e-main:
    name: Dashboard E2E Gate (Main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: './neugi_swarm_v2/pyproject.toml'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install playwright
      - name: Install Playwright browser
        run: playwright install chromium
      - name: Start dashboard runtime
        run: python -m neugi_swarm_v2.cli.cli start
      - name: Run mandatory dashboard E2E flow
        env:
          NEUGI_E2E: "1"
          NEUGI_DASHBOARD_URL: "http://localhost:17901"
        run: pytest tests/test_dashboard_e2e_optional.py -q -p no:anchorpy

  release-evidence:
    name: Release Evidence Bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [dashboard-contract, dashboard-e2e-main, readiness, lint, test-core]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./neugi_swarm_v2[dev]"
      - name: Start dashboard runtime
        run: python -m neugi_swarm_v2.cli.cli start
      - name: Generate release evidence
        env:
          NEUGI_RELEASE_SIGNING_KEY: ${{ secrets.NEUGI_RELEASE_SIGNING_KEY }}
        run: python scripts/release_evidence_bundle.py --base-url http://localhost:17901 --threshold-ms 2500 --trend-regression-pct 60 --trend-strict --require-signature
      - name: Verify signed release manifest
        env:
          NEUGI_RELEASE_SIGNING_KEY: ${{ secrets.NEUGI_RELEASE_SIGNING_KEY }}
        run: |
          latest_manifest=$(ls -t ~/.neugi/reports/release_manifest_*.json | head -1)
          python scripts/verify_release_manifest.py --manifest "$latest_manifest" --signing-key "$NEUGI_RELEASE_SIGNING_KEY"
      - name: Upload release evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            ~/.neugi/reports/release_evidence_*.json
            ~/.neugi/reports/release_evidence_*.md
            ~/.neugi/reports/release_manifest_*.json
            ~/.neugi/reports/synthetic_dashboard_monitor.json
            ~/.neugi/reports/latency_trend_report.json
          retention-days: 30

  readiness:
    name: Readiness Gate (Quickstart CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: './neugi_swarm_v2/pyproject.toml'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Release gate strict (doctor+smoke+quickstart)
        run: python -m neugi_swarm_v2.cli.cli verify-release --json --no-tests

  lint:
    name: Lint, Security & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: './neugi_swarm_v2/pyproject.toml'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check . --quiet
          ruff format --check . --quiet

      - name: Security scan
        run: bandit -r . -c pyproject.toml

      - name: Type check
        run: mypy . --ignore-missing-imports

  test-core:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: './neugi_swarm_v2/pyproject.toml'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run core tests
        run: |
          pytest tests/ -v -p no:anchorpy \
            --ignore=tests/test_autonomous_security_harness.py \
            --ignore=tests/test_cybersecurity_vector_search.py \
            --ignore=tests/test_computer_use.py \
            --ignore=tests/test_security_real.py \
            -x --tb=short 2>&1 | tail -20

  test-full:
    name: Full Tests (including heavy deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install all deps (incl. heavy)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install sentence-transformers scikit-learn playwright 2>&1 | tail -5

      - name: Install Playwright browsers
        run: playwright install chromium 2>&1 | tail -3

      - name: Run ALL tests
        run: pytest tests/ -v -p no:anchorpy -x --tb=short 2>&1 | tail -30
        continue-on-error: true

      - name: Optional dashboard E2E flow check
        env:
          NEUGI_E2E: "1"
          NEUGI_DASHBOARD_URL: "http://localhost:17901"
        run: |
          python -m neugi_swarm_v2.cli.cli start
          pytest tests/test_dashboard_e2e_optional.py -q -p no:anchorpy

  build:
    name: Build Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    needs: [docs-claims, dashboard-contract, readiness, lint, test-core]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine

      - name: Build
        run: python -m build

      - name: Check
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: neugi_swarm_v2/dist/
          retention-days: 30

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [readiness, lint, test-core, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./neugi_swarm_v2
          push: false
          tags: neugi-swarm-v2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
