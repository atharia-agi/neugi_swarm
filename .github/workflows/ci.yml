name: NEUGI Swarm V2 CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_ROOT_USER_ACTION: ignore

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: './neugi_swarm_v2/pyproject.toml'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check neugi_swarm_v2/ --quiet || true
          ruff format --check neugi_swarm_v2/ --quiet || true

      - name: Type check
        run: mypy neugi_swarm_v2/ --ignore-missing-imports || true

  test-core:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: './neugi_swarm_v2/pyproject.toml'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run core tests
        run: |
          pytest tests/ -v -p no:anchorpy \
            --ignore=tests/test_autonomous_security_harness.py \
            --ignore=tests/test_cybersecurity_vector_search.py \
            --ignore=tests/test_computer_use.py \
            --ignore=tests/test_security_real.py \
            -x --tb=short 2>&1 | tail -20

  test-full:
    name: Full Tests (including heavy deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install all deps (incl. heavy)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install sentence-transformers scikit-learn playwright 2>&1 | tail -5

      - name: Install Playwright browsers
        run: playwright install chromium 2>&1 | tail -3

      - name: Run ALL tests
        run: pytest tests/ -v -p no:anchorpy -x --tb=short 2>&1 | tail -30
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neugi_swarm_v2
    needs: [lint, test-core]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine

      - name: Build
        run: python -m build

      - name: Check
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: neugi_swarm_v2/dist/
          retention-days: 30

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test-core, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./neugi_swarm_v2
          push: false
          tags: neugi-swarm-v2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
