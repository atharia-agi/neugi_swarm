[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neugi-swarm-v2"
version = "2.1.3"
description = "NEUGI Swarm V2 - Distributed AI Agent Orchestration Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NEUGI Team", email = "contact@neugi.ai"},
]
keywords = ["ai", "swarm", "agents", "orchestration", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "cryptography>=41.0",
    "httpx>=0.25.0",
    "anyio>=4.0.0",
    "websockets>=11.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
full = [
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "playwright>=1.40.0",
]

[project.scripts]
neugi = "neugi_swarm_v2.cli.cli:main"

[project.urls]
Homepage = "https://neugi.com"
Documentation = "https://atharia-agi.github.io/neugi_swarm/"
Repository = "https://github.com/atharia-agi/neugi_swarm"
Issues = "https://github.com/atharia-agi/neugi_swarm/issues"

[tool.setuptools.packages.find]
include = ["neugi_swarm_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["neugi_swarm_v2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = [
    "S101",   # assert in tests is fine
    "S104",   # binding to all interfaces — intentional for dev servers
    "S105",   # hardcoded password — these are enum values, not actual passwords
    "S110",   # try-except-pass — acceptable for optional cleanup/fallback
    "S112",   # try-except-continue — acceptable for iteration with fallback
    "S113",   # requests without timeout — handled at higher level
    "S307",   # eval — we use restricted builtins scope
    "S310",   # URL open audit — we validate URLs before opening
    "S311",   # pseudo-random — not used for crypto, only for browser fingerprinting
    "S314",   # XML parsing — input is validated before parsing
    "S324",   # insecure hash — sha1 used for WebSocket protocol (RFC 6455 requirement)
    "S603",   # subprocess call audit — we validate commands before execution
    "S607",   # partial executable path — intentional for cross-platform support
    "S608",   # SQL injection — we use parameterized queries where applicable
    "S108",   # insecure temp file — /tmp usage is intentional in tests
    "S102",   # exec — used in controlled tool generation with restricted builtins
    "E402",   # module-level import not at top — intentional for conditional imports
    "E501",   # line too long — handled by formatter, not blocking
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108", "S311"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert in tests is fine

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
